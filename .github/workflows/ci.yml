name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-test-pack:
    name: Build, test and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            tests/LunchMoney.Sdk.Tests/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore LunchMoney.Sdk.slnx --locked-mode

      - name: Build
        run: dotnet build LunchMoney.Sdk.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/LunchMoney.Sdk.Tests/LunchMoney.Sdk.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Pack NuGet and symbols
        run: dotnet pack LunchMoney.Sdk.csproj --configuration Release --no-build --no-restore --output artifacts/packages -warnaserror

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

  official-mock:
    name: Official mock (all SDK operations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            tests/LunchMoney.Sdk.MockTests/packages.lock.json

      - name: Restore locked mock test dependencies
        run: dotnet restore tests/LunchMoney.Sdk.MockTests/LunchMoney.Sdk.MockTests.csproj --locked-mode

      - name: Build mock tests
        run: dotnet build tests/LunchMoney.Sdk.MockTests/LunchMoney.Sdk.MockTests.csproj --configuration Release --no-restore -warnaserror

      - name: Exercise all SDK operations against the official mock
        run: dotnet test tests/LunchMoney.Sdk.MockTests/LunchMoney.Sdk.MockTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=official-mock.trx" --results-directory MockTestResults

      - name: Upload official mock test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-official-mock
          path: MockTestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
